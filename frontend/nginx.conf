# nginx config for the demo profile: serve the built SPA with history-mode
# fallback, and reverse-proxy /api to the Go api container so the browser
# talks same-origin (no CORS, no hardcoded backend host).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API. The Go router serves under /api/* (e.g.
    # /api/products), so the URI is forwarded unchanged (proxy_pass with no
    # path component preserves the original request URI) to api:8080.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history-mode fallback: unknown paths resolve to index.html so
    # vue-router can handle them client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
